# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# Uploaded by build-and-run-unit-tests.sh once the build warning report is available (or the build failed),
# so the comparison runs in parallel with the unit tests.

agents:
  queue: mac

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: ":warning: Build Warning Count"
    command: .buildkite/commands/comment-build-warning-increase.sh
    depends_on:
      - build-warning-baseline
    # Run even when a dependency fails: the script reports missing data as
    # unavailable and only clears the comment after a valid clean comparison.
    allow_dependency_failure: true
    if: build.pull_request.id != null
    # Advisory-only, like the baseline step: a failure here should never
    # turn the PR build red.
    soft_fail: true
    plugins: [$CI_TOOLKIT]
