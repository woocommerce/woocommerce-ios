agents:
  queue: mac

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: "App test target on iOS 26.5"
    command: bash .buildkite/diagnostic-18266-target.sh 'iPhone 17 Pro'
    plugins: [$CI_TOOLKIT]
    timeout_in_minutes: 25
    artifact_paths: &artifacts
      - probe.log
      - probe-result.xcresult.zip
      - '*.ips'
      - simulator-*.json
      - runtimes-*.txt
  - label: "App test target on iOS 27.2"
    command: bash .buildkite/diagnostic-18266-target.sh 'iPhone 18 Pro'
    plugins: [$CI_TOOLKIT]
    timeout_in_minutes: 25
    artifact_paths: *artifacts
