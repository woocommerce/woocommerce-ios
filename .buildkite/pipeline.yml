# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# Steps that can be skipped have `skip: "$SKIP_…"`, decided at upload time by `commands/should-skip-job.sh` (`false` runs the step) and exported by `shared-pipeline-vars`.
# Buildkite doesn't notify for skipped steps, but if you need it to do so anyway, you can use the custom `even-if-skipped: true` attribute on a `notify:`. That custom attribute is picked up by the `notify_skipped_steps` script of the `a8c-ci-toolkit` plugin, which the pipeline upload step (defined in `buildkite-ci`) runs on this file. It takes care of detecting those and emitting a success status to GitHub when the step is skipped, so the checks of skipped jobs don't wait forever.

agents:
  queue: mac

env:
  IMAGE_ID: $IMAGE_ID

# This is the default pipeline – it will build and test the app
steps:
  #################
  # Build the app
  #################
  - label: ":pipeline: Build"
    key: build
    command: .buildkite/commands/build-for-testing.sh
    skip: "$SKIP_BUILD"
    plugins: [$CI_TOOLKIT]
    notify:
      - github_commit_status:
          context: Build
        even-if-skipped: true

  - label: ":microscope: Unit Tests"
    key: unit-tests
    command: .buildkite/commands/run-unit-tests.sh
    depends_on: build
    parallelism: 3
    plugins: [$CI_TOOLKIT]
    artifact_paths:
      - fastlane/test_output/*
