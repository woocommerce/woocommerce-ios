---
agents:
  queue: mac

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: "TEMP: Seed warning reports, expected advisory failure (42)"
    key: temp-warning-seed
    command: ruby .buildkite/commands/temporary-warning-probe.rb seed
    plugins: [$CI_TOOLKIT]
    timeout_in_minutes: 10
    soft_fail:
      - exit_status: 42

  - label: "TEMP: Verify warning recovery and simulated stale execution"
    key: temp-warning-verify
    command: ruby .buildkite/commands/temporary-warning-probe.rb verify
    plugins: [$CI_TOOLKIT]
    timeout_in_minutes: 10
    depends_on: temp-warning-seed
    allow_dependency_failure: true
    notify:
      - github_commit_status:
          context: "TEMP Warning Validation"
