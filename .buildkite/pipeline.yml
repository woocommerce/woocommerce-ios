# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

agents:
  queue: mac

env:
  IMAGE_ID: $IMAGE_ID

# This is the default pipeline – it will build and test the app
steps:
  #################
  # Build the app
  #################
  - label: ":pipeline: Build"
    key: build
    command: .buildkite/commands/build-for-testing.sh
    plugins: [$CI_TOOLKIT]
    notify:
      - github_commit_status:
          context: Build

  #################
  # Create Prototype Build
  #################
  - group: ":rocket: Prototype Build"
    # Prototype Builds are on-demand on `trunk`, but always built on PRs
    steps:
      - input: Create Prototype Build?
        prompt: Share a Prototype Build via Firebase App Distribution?
        key: prototype_build_triggered
        if: build.branch == "trunk"
      - label: ":firebase: Prototype Build"
        # Buildkite considers this implicitly satisfied if the `depends_on` step is skipped due to `if:` condition. So this will run unconditionally on PRs
        # https://buildkite.com/docs/pipelines/configure/dependencies#how-skipped-steps-affect-dependencies
        depends_on: prototype_build_triggered
        if: build.pull_request.id != null || build.branch == "trunk"
        command: .buildkite/commands/prototype-build.sh
        plugins: [$CI_TOOLKIT]
        notify:
          - github_commit_status:
              context: Prototype Build

  #################
  # Run Unit Tests
  #################
  - label: ":microscope: Unit Tests"
    command: .buildkite/commands/run-unit-tests.sh
    depends_on: build
    plugins:
      - $CI_TOOLKIT
      - ${TEST_COLLECTOR}:
          files: fastlane/test_output/report.junit
          format: junit
          missing-error: 0
          api-token-env-name: BUILDKITE_ANALYTICS_TOKEN_UNIT_TESTS
    artifact_paths:
      - fastlane/test_output/*
    notify:
      - github_commit_status:
          context: Unit Tests

  - label: ":microscope: Standalone WordPressAuthenticator Unit Tests"
    command: .buildkite/commands/run-wordpress-authenticator-tests.sh
    plugins: [$CI_TOOLKIT]
    artifact_paths:
      - fastlane/test_output/*
    notify:
      - github_commit_status:
          context: WordPressAuthenticator Unit Tests

  #################
  # Ruby Automation Tests (Fastlane helpers)
  #################
  - label: ":ruby: Ruby Automation Tests"
    command: .buildkite/commands/run-ruby-automation-tests.sh
    plugins: [$CI_TOOLKIT]
    notify:
      - github_commit_status:
          context: Ruby Automation Tests

  #################
  # Linters
  #################
  - group: Linters
    steps:
      - label: ":danger: Danger - PR Check"
        command: danger
        key: danger
        if: build.pull_request.id != null
        retry:
          manual:
            permit_on_passed: true
        agents:
          queue: linter
        notify:
          - github_commit_status:
              context: Danger - PR Check

      - label: ":swift: SwiftLint"
        command: swiftlint
        notify:
          - github_commit_status:
              context: SwiftLint
        agents:
          queue: linter


      - label: 🧹 Lint Translations
        command: gplint /workdir/WooCommerce/Resources/AppStoreStrings.pot
        plugins:
          - docker#v3.8.0:
              image: public.ecr.aws/automattic/glotpress-validator:1.0.0
        agents:
          queue: default
        notify:
          - github_commit_status:
              context: Lint Translations

      - label: ":sleuth_or_spy: Lint Localized Strings Format"
        command: .buildkite/commands/lint-localized-strings-format.sh
        plugins: [$CI_TOOLKIT]
        notify:
          - github_commit_status:
              context: Lint Localized Strings Format

      - label: ":swift: Ensure single Package.resolved"
        command: .buildkite/commands/check-package-resolved.sh
        agents:
          queue: default
        notify:
          - github_commit_status:
              context: Check Package.resolved

  #################
  # UI Tests
  #################
  - label: ":microscope: UI Tests (iPhone)"
    command: .buildkite/commands/run-ui-tests.sh UITests "iPhone 17"
    depends_on: build
    # Run on `trunk` and `release/*`, and on PRs with the `run ui tests` label.
    if: build.branch == "trunk" || build.branch =~ /^release\// || (build.pull_request.id != null && build.pull_request.labels includes "run ui tests")
    plugins:
      - $CI_TOOLKIT
      - ${TEST_COLLECTOR}:
          files: fastlane/test_output/report.junit
          format: junit
          missing-error: 0
          api-token-env-name: BUILDKITE_ANALYTICS_TOKEN_UI_TESTS_IPHONE
    artifact_paths:
      - fastlane/test_output/*
      - build/logs/wiremock.txt
    notify:
      - github_commit_status:
          context: UI Tests (iPhone)

  - label: ":microscope: UI Tests (iPad)"
    command: .buildkite/commands/run-ui-tests.sh UITests "iPad Pro 13-inch (M5)"
    depends_on: build
    # Run on `trunk` and `release/*`, and on PRs with the `run ui tests` label.
    if: build.branch == "trunk" || build.branch =~ /^release\// || (build.pull_request.id != null && build.pull_request.labels includes "run ui tests")
    plugins:
      - $CI_TOOLKIT
      - ${TEST_COLLECTOR}:
          files: fastlane/test_output/report.junit
          format: junit
          missing-error: 0
          api-token-env-name: BUILDKITE_ANALYTICS_TOKEN_UI_TESTS_IPAD
    artifact_paths:
      - fastlane/test_output/*
      - build/logs/wiremock.txt
    notify:
      - github_commit_status:
          context: UI Tests (iPad)

  #################
  # Maestro live-store smoke tests (on demand, non-blocking)
  #################
  - input: Run Maestro live-store smoke tests?
    prompt: Run the production-like simulator suite against the protected iOS test store?
    key: maestro_smoke_triggered
    if: build.branch == "trunk"
    fields:
      - select: Profile
        key: maestro-profile
        default: release
        options:
          - label: Release
            value: release
          - label: Burst (three release runs)
            value: burst
          - label: POS (eligible iPad)
            value: pos-ipad
          - label: iOS system surfaces
            value: ios-system
      - select: Simulator app
        key: maestro-app-variant
        default: debug
        options:
          - label: Debug artifact from this build
            value: debug
          - label: Alpha/prototype artifact
            value: prototype
      - text: App artifact name
        key: maestro-app-artifact
        default: build-products.tar
      - text: App path after extraction
        key: maestro-app-path
        required: false
        hint: Required for Alpha/prototype; for example build/Prototype/WooCommerce.app
      - text: Source Buildkite build ID
        key: maestro-app-source-build-id
        required: false
        hint: Optional; use when the app artifact belongs to another Buildkite build

  - label: ":iphone: Maestro live-store smoke"
    depends_on:
      - build
      - maestro_smoke_triggered
    if: build.branch == "trunk"
    command: |
      export MAESTRO_PROFILE="$(buildkite-agent meta-data get maestro-profile)"
      export MAESTRO_APP_VARIANT="$(buildkite-agent meta-data get maestro-app-variant)"
      export MAESTRO_APP_ARTIFACT="$(buildkite-agent meta-data get maestro-app-artifact)"
      export MAESTRO_APP_PATH="$(buildkite-agent meta-data get maestro-app-path --default '')"
      export MAESTRO_APP_SOURCE_BUILD_ID="$(buildkite-agent meta-data get maestro-app-source-build-id --default '')"
      .buildkite/commands/run-maestro-tests.sh
    secrets:
      MAESTRO_WOO_LAB_JETPACK_STORE_URL: MAESTRO_WOO_LAB_JETPACK_STORE_URL
      MAESTRO_WOO_LAB_WPCOM_EMAIL: MAESTRO_WOO_LAB_WPCOM_EMAIL
      MAESTRO_WOO_LAB_WPCOM_PASSWORD: MAESTRO_WOO_LAB_WPCOM_PASSWORD
    plugins: [$CI_TOOLKIT]
    soft_fail: true
    concurrency: 1
    concurrency_group: "woocommerce-ios/maestro/${MAESTRO_CI_RESOURCE_KEY:-unconfigured}"
    artifact_paths:
      - build/maestro/**/report.xml
      - build/maestro/**/report.html
      - build/maestro/**/screenshots/**/*
      - build/maestro/**/diagnostics/**/*
      - build/maestro/**/logs/**/*
      - build/maestro/**/run-summary.json

  #################
  # Claude Build Analysis - dynamically uploaded so Build result conditions evaluate at runtime after the wait
  #################
  - wait: ~
    continue_on_failure: true

  - label: ":claude: 🕵️ Check for Build Failures and Run Claude Analysis"
    command: .buildkite/commands/upload-claude-analysis.sh
    agents:
      queue: upload
