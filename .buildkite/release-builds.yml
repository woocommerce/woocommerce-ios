# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# This pipeline is meant to be run via the Buildkite API, and is only used for release builds

agents:
  queue: mac

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: ":hammer_and_wrench: Release Build (App Store Connect)"
    # Temporary: drop RBENV_VERSION once .ruby-version is 3.4.13 (AINFRA-3878); the Linux agents lack it until AINFRA-3889/3890/3891.
    command: |
      export RBENV_VERSION=3.4.13
      checkout_release_branch "$RELEASE_VERSION"

      .buildkite/commands/release-build.sh ${IS_BETA_RELEASE}
    priority: 1
    plugins: [$CI_TOOLKIT]
    notify:
      - slack: "#build-and-ship"
    retry:
      manual:
        # If those jobs fail, one should always prefer re-triggering a new build from ReleaseV2 rather than retrying the individual job from Buildkite
        allowed: false
