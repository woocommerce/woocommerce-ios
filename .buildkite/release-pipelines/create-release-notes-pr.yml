# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

agents:
  queue: mac

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: Create Release Notes PR
    plugins: [$CI_TOOLKIT]
    command: |
      echo '--- :robot_face: Use bot for Git operations'
      source use-bot-for-git

      echo '--- :ruby: Setup Ruby Tools'
      install_gems

      echo '--- :closed_lock_with_key: Access Secrets'
      bundle exec fastlane run configure_apply

      echo '--- :memo: Create Release Notes PR'
      bundle exec fastlane create_release_notes_pr \
        version:"${RELEASE_VERSION}" \
        skip_confirm:true \
        dry_run:"${DRY_RUN:-false}"
    retry:
      manual:
        # The lane is idempotent and will reuse an existing release notes PR if one exists.
        # Prefer re-triggering from ReleasesV2 over retrying the individual job from Buildkite.
        reason: Re-trigger from ReleasesV2 instead. The lane is idempotent and will reuse an existing release notes PR if one exists.
        allowed: false
