# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

agents:
  queue: mac

env:
  IMAGE_ID: $IMAGE_ID

priority: 1

steps:
  - label: New Hotfix Release
    plugins: [$CI_TOOLKIT]
    # Temporary: drop RBENV_VERSION once .ruby-version is 3.4.13 (AINFRA-3878); the Linux agents lack it until AINFRA-3889/3890/3891.
    command: |
      export RBENV_VERSION=3.4.13
      echo '--- :robot_face: Use bot for Git operations'
      source use-bot-for-git

      echo '--- :ruby: Setup Ruby Tools'
      install_gems

      echo '--- :fire: Start New Hotfix Release'
      bundle exec fastlane new_hotfix_release version:${VERSION} skip_confirm:true
    retry:
      manual:
        # If those jobs fail, one should always prefer re-triggering a new build from Releases V2 rather than retrying the individual job from Buildkite
        reason: If release jobs fail, you should always re-trigger the task from Releases V2 rather than retrying the individual job from Buildkite
        allowed: false
