name: Screenshots

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  build:
    name: Build Application
    # Only run for PRs from the same repo (not forks) and with the 'generate screenshots' label
    if: |
      github.event.pull_request.head.repo.fork != true &&
      contains(github.event.pull_request.labels.*.name, 'generate screenshots')
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
    - name: "Check out Project"
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: "Set up Ruby"
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        bundler-cache: true

    - name: Check Screenshot Runtime Support
      run: bundle exec fastlane check_screenshot_runtime_support

    - name: Install App Dependencies
      run: bundle exec rake dependencies

    - name: Compile the App
      run: bundle exec fastlane build_screenshots

    # upload-artifact drops symlinks and executable bits, which corrupts the `.app`/`.xctest`
    # bundles and makes the test bundle fail to load in the capture job. Tar preserves both.
    - name: Archive Build Products
      run: tar -cf build-products.tar -C DerivedData/Build/Products Debug-iphonesimulator
    - name: Upload Build Products
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: screenshot-build-products
        path: build-products.tar
        retention-days: 1

  capture:
    name: Capture
    needs: build
    runs-on: xcode-27
    timeout-minutes: 120

    strategy:
      # Don't let one locale's flaky accessibility-hierarchy timeout cancel the other locales'
      # screenshots (see the note on `number_of_retries` in the Fastfile).
      fail-fast: false
      matrix:
        language: [ar-SA, de-DE, en-US, es-ES, fr-FR, he, id, it, ja, ko, nl-NL, pt-BR, ru, sv, tr, zh-Hans, zh-Hant]
        mode: [dark, light]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: "Set up Ruby"
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        bundler-cache: true

    - name: Download Build Products
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: screenshot-build-products
    - name: Extract Build Products
      run: |
        mkdir -p DerivedData/Build/Products
        tar -xf build-products.tar -C DerivedData/Build/Products

    - name: Generate Screenshots
      run: |
        bundle exec fastlane take_screenshots languages:${{ matrix.language }} mode:${{ matrix.mode }}

    - name: Check Captured Images
      env:
        SCREENSHOT_LOCALE: ${{ matrix.language }}
        SCREENSHOT_MODE: ${{ matrix.mode }}
      run: |
        python3 - <<'PY'
        import os
        import pathlib
        import struct

        directory = pathlib.Path('fastlane/screenshots') / os.environ['SCREENSHOT_LOCALE']
        mode = os.environ['SCREENSHOT_MODE']
        phone = ['order-dashboard', 'order-creation', 'order-payment', 'product-add', 'order-notification']
        ipad = phone[:3] + ['pos-dashboard', 'pos-payment', 'pos-success'] + phone[3:]
        for device, scenes, size in [
            ('iPhone 17 Pro Max', phone, (1320, 2868)),
            ('iPad Pro 13-inch (M5)', ipad, (2752, 2064)),
            ('iPhone Duo', phone, (1398, 2034)),
        ]:
            expected = {f'{device}-{i}-{mode}-{scene}.png' for i, scene in enumerate(scenes, 1)}
            found = {p.name for p in directory.glob(f'{device}-*-{mode}-*.png')}
            assert found == expected, (device, expected - found, found - expected)
            for name in sorted(expected):
                header = (directory / name).read_bytes()[:24]
                assert header[:8] == b'\x89PNG\r\n\x1a\n', name
                assert struct.unpack('>II', header[16:24]) == size, name
            product = directory / f'{device}-{len(scenes) - 1}-{mode}-product-add.png'
            notification = directory / f'{device}-{len(scenes)}-{mode}-order-notification.png'
            assert notification.read_bytes() != product.read_bytes(), f'{device}: notification repeats the product screen'
        print(f'Validated all 18 captures for {directory.name}/{mode}')
        PY

    - name: Store Logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: "screenshot-log-${{ matrix.language }}-${{ matrix.mode }}"
        path: |
          fastlane/logs
          fastlane/screenshots/test_output

    - name: Archive Generated Screenshots
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: "screenshots-${{ matrix.language }}-${{ matrix.mode }}"
        path: fastlane/screenshots/

  process:
    name: "Process Screenshots"
    needs: capture
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      # Push the generated-screenshots branch
      contents: write
      # Create PR from the generated-screenshots branch to the original PR branch
      pull-requests: write

    env:
      BUNDLE_WITH: screenshots

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Compose and commit assets from the same revision used by the capture jobs.
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch LFS files for promo screenshot generation
          lfs: true

      - name: Create screenshots branch
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          SCREENSHOTS_BRANCH="generated-screenshots/${COMMIT_SHA}"
          echo "SCREENSHOTS_BRANCH=${SCREENSHOTS_BRANCH}" >> $GITHUB_ENV
          git checkout -b "${SCREENSHOTS_BRANCH}"

      - name: Install Native Dependencies
        run: |
          brew install imagemagick@7
          brew link imagemagick@7 --force
          brew install automattic/build-tools/drawText

      - name: "Set up Ruby"
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true

      - name: Download Generated Screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "screenshots-*"
          path: fastlane/screenshots/
          merge-multiple: true

      - name: Generate Screenshot Summary
        run: |
          bundle exec fastlane create_screenshot_summary

      - name: Upload Screenshot Summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-summary
          path: fastlane/screenshots/screenshots.html

      - name: Archive Raw Screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raw-screenshots
          path: fastlane/screenshots

      - name: Configure Git for committing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Promo Screenshots
        run: |
          ruby fastlane/helpers/promo_screenshots_config_test.rb
          ruby fastlane/helpers/promo_screenshot_validation_test.rb
          ruby fastlane/helpers/promo_composition_failure_test.rb
          bundle exec ruby fastlane/helpers/promo_screenshot_normalization_check.rb
          bundle exec fastlane create_promo_screenshots force:true commit:true

      - name: Archive Promo Screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promo-screenshots
          path: fastlane/promo_screenshots

      - name: Push screenshots branch and create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if there are any commits to push (the lane may have committed nothing)
          if git diff --quiet origin/${{ github.head_ref }}..HEAD; then
            echo "No new screenshots to commit"
            exit 0
          fi

          git push origin "${SCREENSHOTS_BRANCH}"

          # Note: GHA doesn't provide a run URL variable, so we build it from components
          gh pr create \
            --base "${{ github.head_ref }}" \
            --head "${SCREENSHOTS_BRANCH}" \
            --label "category: screenshots" \
            --title "Add generated screenshots" \
            --body "This PR adds the screenshots generated from #${{ github.event.pull_request.number }}.

          Merge this PR to add the screenshots to your branch.

          ---
          _Automatically generated by the [Screenshots workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._"
