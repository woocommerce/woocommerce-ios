# p2: hub.google-for-woo
# Runs on the shared store, which has Google for WooCommerce, so a missing row fails the flow.
appId: ${APP_ID}
name: "Google for WooCommerce - Campaign webview"
tags:
  - smoke_extended
  - hub_menu
  - store_shared
---
- runFlow:
    file: ../subflows/ensure_logged_in.yaml
- runFlow:
    file: ../subflows/navigate_to_more_menu.yaml
- scrollUntilVisible:
    element:
      id: "menu-google-ads"
    direction: DOWN
    timeout: 15000
    label: "Require a Google for WooCommerce-eligible extended-smoke store"
- tapOn:
    id: "menu-google-ads"
- extendedWaitUntil:
    visible: "Google for WooCommerce"
    timeout: 30000
- assertVisible: "Cancel"
# The title above is the app's own, so wait for the campaign creation page
# itself. The shared store has no campaign, so the menu opens this page.
- extendedWaitUntil:
    visible: "Create your campaign"
    timeout: 60000
- extendedWaitUntil:
    visible: "Set your budget"
    timeout: 30000
- assertNotVisible:
    id: "menu-google-ads"
- takeScreenshot: google_for_woo_webview
- tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      id: "menu-google-ads"
    timeout: 15000
