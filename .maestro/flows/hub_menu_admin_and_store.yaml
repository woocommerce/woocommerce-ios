# p2: hub.change-store, hub.wc-admin, hub.view-store
appId: ${APP_ID}
name: "Hub Menu - WooCommerce Admin, View Store, and change store"
tags:
  - smoke_extended
  - flaky_quarantine
  - hub_menu
---
- runFlow:
    file: ../subflows/ensure_logged_in.yaml
- runFlow:
    file: ../subflows/navigate_to_more_menu.yaml
# The row can sit under the floating tab bar while still being in the
# hierarchy, and the tap then lands on the tab bar instead.
- scrollUntilVisible:
    element:
      id: "menu-view-store"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "menu-view-store"
- extendedWaitUntil:
    visible: "View Store"
    timeout: 20000
- assertVisible: "View Store"
- assertNotVisible:
    id: "menu-view-store"
- takeScreenshot: hub_view_store
- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible:
      id: "menu-view-store"
    timeout: 15000
- tapOn:
    id: "menu-woocommerce-admin"
- extendedWaitUntil:
    visible: "WooCommerce Admin"
    timeout: 20000
- assertVisible: "WooCommerce Admin"
- assertNotVisible:
    id: "menu-woocommerce-admin"
- takeScreenshot: hub_woocommerce_admin
- tapOn:
    id: "BackButton"
# The menu keeps the scroll position it had before the web view, and the store
# card sits at the top of the list.
- scrollUntilVisible:
    element:
      id: "store-title"
    direction: UP
    timeout: 15000
- copyTextFrom:
    id: "store-title"
- evalScript: |
    output.storeOriginalName = String(maestro.copiedText || '').trim();
- copyTextFrom:
    id: "store-url"
- evalScript: |
    function host(value) {
      return String(value || '').trim().toLowerCase()
        .replace(/^https?:\/\//, '')
        .split('/')[0]
        .split('?')[0]
        .split('#')[0]
        .replace(/:\d+$/, '')
        .replace(/\.$/, '');
    }
    output.storeOriginalURL = String(maestro.copiedText || '').trim();
    output.storeOriginalHost = host(output.storeOriginalURL);
    if (!output.storeOriginalHost) {
      throw new Error('Current Hub store URL is empty');
    }
- tapOn:
    id: "store-title"
- extendedWaitUntil:
    visible: "Select Store"
    timeout: 20000
- assertVisible: "Select Store"
- assertVisible: "PICK STORE TO CONNECT"
- copyTextFrom:
    id: "url-label"
    index: 0
- evalScript: ${output.storeCandidateZeroURL = maestro.copiedText.trim()}
- copyTextFrom:
    id: "url-label"
    index: 1
- evalScript: ${output.storeCandidateOneURL = maestro.copiedText.trim()}
# Keep the copied strings raw: a value built inside a function does not survive
# to the next command, so pick between them with inline conditions.
- runFlow:
    when:
      true: ${String(output.storeCandidateZeroURL).toLowerCase().split('://').pop().split('/')[0] != String(output.storeOriginalURL).toLowerCase().split('://').pop().split('/')[0]}
    commands:
      - evalScript: ${output.storeTargetURL = output.storeCandidateZeroURL}
- runFlow:
    when:
      true: ${String(output.storeCandidateZeroURL).toLowerCase().split('://').pop().split('/')[0] == String(output.storeOriginalURL).toLowerCase().split('://').pop().split('/')[0]}
    commands:
      - evalScript: ${output.storeTargetURL = output.storeCandidateOneURL}
- assertTrue:
    condition: ${output.storeTargetURL && String(output.storeTargetURL).toLowerCase().split('://').pop().split('/')[0] != String(output.storeOriginalURL).toLowerCase().split('://').pop().split('/')[0]}
    label: Store picker exposes a different Woo store in its first two rows
- takeScreenshot: hub_store_picker_discovery
- tapOn:
    text: "${output.storeTargetURL}"
- takeScreenshot: hub_store_picker_target_selected
- extendedWaitUntil:
    visible:
      id: "login-epilogue-continue-button"
      enabled: true
    timeout: 10000
- tapOn:
    id: "login-epilogue-continue-button"
- extendedWaitUntil:
    visible: "Menu"
    timeout: 90000
- tapOn: "Menu"
- extendedWaitUntil:
    visible:
      id: "store-title"
    timeout: 30000
- copyTextFrom:
    id: "store-url"
- assertTrue:
    condition: ${String(maestro.copiedText || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/$/, '') !== String(MAESTRO_WOO_LAB_JETPACK_STORE_URL || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/$/, '')}
    label: Hub identity changed to the dynamically selected store
- tapOn: "Products"
- extendedWaitUntil:
    visible:
      id: "products-table-view"
    timeout: 30000
- assertVisible:
    id: "products-table-view"
- takeScreenshot: hub_change_store_target_loaded

# Restore the shared account's original store immediately after the target
# store-backed surface has loaded, then prove the original identity returned.
- tapOn: "Menu"
- extendedWaitUntil:
    visible:
      id: "store-title"
    timeout: 20000
- tapOn:
    id: "store-title"
- extendedWaitUntil:
    visible: "Select Store"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "url-label"
      text: ".*${MAESTRO_WOO_LAB_JETPACK_STORE_HOST}.*"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "url-label"
    text: ".*${MAESTRO_WOO_LAB_JETPACK_STORE_HOST}.*"
- takeScreenshot: hub_store_picker_original_selected
- extendedWaitUntil:
    visible:
      id: "login-epilogue-continue-button"
      enabled: true
    timeout: 10000
- tapOn:
    id: "login-epilogue-continue-button"
- extendedWaitUntil:
    visible: "Menu"
    timeout: 90000
- tapOn: "Menu"
- extendedWaitUntil:
    visible:
      id: "store-url"
    timeout: 30000
- copyTextFrom:
    id: "store-url"
- assertTrue:
    condition: ${String(maestro.copiedText || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/$/, '') === String(MAESTRO_WOO_LAB_JETPACK_STORE_URL || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/$/, '')}
    label: Original Hub store identity is restored
- tapOn: "Products"
- extendedWaitUntil:
    visible:
      id: "products-table-view"
    timeout: 30000
- assertVisible:
    id: "products-table-view"
- takeScreenshot: hub_change_store_restored
