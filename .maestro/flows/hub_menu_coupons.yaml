# p2: hub.coupons.create
appId: ${APP_ID}
name: "Hub Menu - Coupons"
tags:
  - smoke_extended
  - destructive
  - hub_menu
---
- runFlow:
    file: ../subflows/ensure_logged_in.yaml
- runFlow:
    file: ../subflows/navigate_to_more_menu.yaml
- scrollUntilVisible:
    element:
      id: "menu-coupons"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "menu-coupons"
- extendedWaitUntil:
    visible:
      id: "coupon-create-button"
    timeout: 20000
- assertVisible: "Coupons"
- tapOn:
    id: "coupon-create-button"
- extendedWaitUntil:
    visible: "Create Coupon"
    timeout: 10000
- assertVisible: "Percentage Discount"
- assertVisible: "Fixed Cart Discount"
- assertVisible: "Fixed Product Discount"
- tapOn: "Percentage Discount"
- extendedWaitUntil:
    visible: "Create coupon"
    timeout: 15000
- assertVisible: "Coupon Code"
- assertVisible: "Regenerate Coupon Code"
- assertVisible: "Discount Type"
- takeScreenshot: hub_coupon_creation_form
# rightOf compares only x positions, so each field is also boxed in by the
# rows above and below it.
- tapOn:
    text: "0"
    rightOf: "Amount \\(%\\)"
    below: "Discount Type"
    above: "Set the percentage of the discount you want to offer."
- eraseText
- inputText: "10"
- tapOn:
    text: ".+"
    rightOf: "Coupon Code"
    below: "Set the percentage of the discount you want to offer."
    above: "Customers need to enter this code to use the coupon."
- eraseText
# The -UI suffix keeps this coupon apart from any other one carrying the run id.
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: ${SUITE_RUN_ID}-UI
- scrollUntilVisible:
    element: "Create"
    direction: DOWN
    timeout: 10000
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Your new coupon was created!"
    timeout: 30000
# A tap while the sheet is still sliding in does not close it.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Your new coupon was created!"
    timeout: 10000
# WooCommerce stores the code in lowercase, and text matching ignores case.
- extendedWaitUntil:
    visible: ".*${SUITE_RUN_ID}-UI.*"
    timeout: 30000
- takeScreenshot: hub_coupon_created
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "menu-coupons"
    timeout: 10000
