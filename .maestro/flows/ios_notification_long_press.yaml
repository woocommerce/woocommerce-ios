# p2: other.ios-push-long-press
# The runner delivers .maestro/helpers/store_order_push.json before the flow, an
# order notification with the store_order category the notification extension handles.
# On the simulator a long press never expands a notification; swiping left and
# tapping View opens the same notification content extension.
appId: ${APP_ID}
name: "iOS system - Notification long press"
tags:
  - ios_system
---
- runFlow: ../subflows/ensure_logged_in.yaml
- stopApp
- pressKey: HOME
- swipe:
    start: "50%,1%"
    end: "50%,75%"
    duration: 1000
- extendedWaitUntil:
    visible: ".*[Nn]ew order.*"
    timeout: 10000
- swipe:
    from:
      text: ".*[Nn]ew order.*"
      index: 0
    direction: LEFT
- extendedWaitUntil:
    visible: "View"
    timeout: 5000
- tapOn: "View"
# The extension renders the order preview when it can load the order, and this
# fallback text when it cannot. Either proves the extension opened; the
# notification's own title also contains "new order", so match the exact text.
- extendedWaitUntil:
    visible: "New order for|Unable to load notification"
    timeout: 15000
- takeScreenshot: ios_notification_long_press
