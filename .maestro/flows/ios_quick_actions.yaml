# p2: other.quick-actions
# Exercises the installed app's real UIApplicationShortcutItems. The runner passes
# the app's display name, so a Debug or Alpha build is found by its own label.
appId: ${APP_ID}
name: "iOS system - Home-screen Quick Actions"
tags:
  - ios_system
---
- runFlow: ../subflows/ensure_logged_in.yaml
- stopApp
- pressKey: HOME
# Search for the exact app. The simulator can also carry WooCommerce, other Woo
# builds and maestro-driver, so a loose `Woo.*` at index 0 matched whichever
# sorted first - a different app, whose context menu offers only "Delete App".
# Maestro also matches a selector as literal text, so the name needs no escaping.
- tapOn:
    text: Search
    index: 0
- inputText: ${APP_DISPLAY_NAME}
- hideKeyboard
- extendedWaitUntil:
    visible: ${APP_DISPLAY_NAME}
    timeout: 15000
- longPressOn: ${APP_DISPLAY_NAME}
- assertVisible: New Order
- assertVisible: Orders
- assertVisible: Add a product
- assertVisible: Collect Payment
- takeScreenshot: ios_quick_actions
# Tap the shortcut by name. The previous `point: "35%,24%"` was the only
# coordinate tap in the suite and assumed a fixed screen size; in the search
# result menu that position lands on "Delete App".
- tapOn: New Order
- extendedWaitUntil:
    visible:
      id: new-order-create-button
    timeout: 30000
- assertVisible:
    id: new-order-cancel-button
