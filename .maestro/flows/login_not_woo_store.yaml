# p2: login.not-woo-store
# Required fixture: a WordPress site without WooCommerce and its site-admin
# credentials. WP.com email/password are required for wordpress.com-hosted
# fixtures and optional for self-hosted fixtures that expose site credentials.
appId: ${APP_ID}
name: "Login - Not a WooCommerce store error"
tags:
  - smoke_extended
  - flaky_quarantine
  - login
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    file: ../subflows/open_site_address_login.yaml
- tapOn:
    id: "Site address"
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: ${MAESTRO_WOO_NOT_A_WOO_STORE_URL}
- hideKeyboard
- tapOn:
    id: "Site Address Next Button"

# Wait for either authentication route. Prefer the site-admin path when the
# WP.com screen offers it explicitly.
- extendedWaitUntil:
    visible: "Username|Email address"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "Sign in with site credentials Button"
    commands:
      - tapOn:
          id: "Sign in with site credentials Button"
      - extendedWaitUntil:
          visible: "Username"
          timeout: 30000

# Self-hosted sites show Username and Password on the same screen.
- runFlow:
    when:
      visible: "Username"
    commands:
      - tapOn: "Username"
      - runFlow:
          file: ../subflows/paste_into_focused_field.yaml
          env:
            TEXT_TO_PASTE: ${MAESTRO_WOO_NOT_A_WOO_STORE_SITE_ADMIN_USERNAME}
      - tapOn: "Password"
      - runFlow:
          file: ../subflows/paste_into_focused_field.yaml
          env:
            TEXT_TO_PASTE: ${MAESTRO_WOO_NOT_A_WOO_STORE_SITE_ADMIN_PASSWORD}
      - hideKeyboard
      - tapOn: "Continue"

# Fall back to WP.com credentials when no site-admin route is available.
- runFlow:
    when:
      visible:
        id: "Email address"
    commands:
      - tapOn:
          id: "Email address"
      - runFlow:
          file: ../subflows/paste_into_focused_field.yaml
          env:
            TEXT_TO_PASTE: ${MAESTRO_WOO_NOT_A_WOO_STORE_WPCOM_EMAIL}
      - hideKeyboard
      - tapOn:
          id: "Get Started Email Continue Button"
      - extendedWaitUntil:
          visible:
            id: "Password"
          timeout: 30000
      - tapOn:
          id: "Password"
      - runFlow:
          file: ../subflows/paste_into_focused_field.yaml
          env:
            TEXT_TO_PASTE: ${MAESTRO_WOO_NOT_A_WOO_STORE_WPCOM_PASSWORD}
      - hideKeyboard
      - runFlow:
          when:
            visible:
              id: "Continue Button"
          commands:
            - tapOn:
                id: "Continue Button"
      - runFlow:
          file: ../subflows/dismiss_save_password_prompt.yaml
- extendedWaitUntil:
    visible: '.*is not a WooCommerce site\.'
    timeout: 60000
- assertVisible: "Log In With Another Account"
- takeScreenshot: login_not_woo_store
