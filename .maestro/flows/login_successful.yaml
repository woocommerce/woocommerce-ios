# p2: login.jetpack
# Kept last in config execution order so the suite leaves a reusable session.
appId: ${APP_ID}
name: "Login - Successful Jetpack store login"
tags:
  - smoke_core
  - login
---
- runFlow:
    file: ../subflows/login.yaml
- assertVisible:
    id: "tab-bar-my-store-item"
- assertVisible:
    id: "tab-bar-orders-item"
- assertVisible:
    id: "tab-bar-products-item"
- takeScreenshot: login_successful
