# p2: login.wrong-account
# Required fixture: a Jetpack store inaccessible to the primary WP.com account.
appId: ${APP_ID}
name: "Login - Wrong account for the store"
tags:
  - smoke_extended
  - flaky_quarantine
  - login
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "Login Onboarding Skip Button|prologue-title-label"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "Login Onboarding Skip Button"
    commands:
      - tapOn:
          id: "Login Onboarding Skip Button"
- extendedWaitUntil:
    visible:
      id: "prologue-title-label"
    timeout: 15000
- tapOn:
    id: "Prologue Self Hosted Button"
- runFlow:
    when:
      visible: "No computer? Log in with site address"
    commands:
      - tapOn: "No computer? Log in with site address"
- extendedWaitUntil:
    visible:
      id: "Site address"
    timeout: 15000
- tapOn:
    id: "Site address"
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: ${MAESTRO_WOO_WRONG_ACCOUNT_STORE_URL}
- hideKeyboard
- tapOn:
    id: "Site Address Next Button"
- extendedWaitUntil:
    visible:
      id: "Email address"
    timeout: 30000
- tapOn:
    id: "Email address"
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: ${MAESTRO_WOO_LAB_WPCOM_EMAIL}
- hideKeyboard
- tapOn:
    id: "Get Started Email Continue Button"
- extendedWaitUntil:
    visible:
      id: "Password"
    timeout: 30000
- tapOn:
    id: "Password"
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: ${MAESTRO_WOO_LAB_WPCOM_PASSWORD}
- hideKeyboard
- runFlow:
    when:
      visible:
        id: "Continue Button"
    commands:
      - tapOn:
          id: "Continue Button"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: '.*is connected to a different account\.'
    timeout: 60000
- assertVisible: "Find your connected email"
- assertVisible: "Log Out"
- takeScreenshot: login_wrong_account
