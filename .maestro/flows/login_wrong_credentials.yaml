# p2: login.wrong-credentials
# Uses the real WP.com identity with a deliberately invalid password.
appId: ${APP_ID}
name: "Login - Wrong credentials error"
tags:
  - smoke_extended
  - flaky_quarantine
  - login
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "Login Onboarding Skip Button|prologue-title-label"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "Login Onboarding Skip Button"
    commands:
      - tapOn:
          id: "Login Onboarding Skip Button"
- extendedWaitUntil:
    visible:
      id: "prologue-title-label"
    timeout: 15000
- tapOn:
    id: "Prologue Continue Button"
- extendedWaitUntil:
    visible:
      id: "Email address"
    timeout: 15000
- tapOn:
    id: "Email address"
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: ${MAESTRO_WOO_LAB_WPCOM_EMAIL}
- hideKeyboard
- tapOn:
    id: "Get Started Email Continue Button"
- extendedWaitUntil:
    visible:
      id: "Password"
    timeout: 30000
- tapOn:
    id: "Password"
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: "maestro-intentionally-wrong-password"
- hideKeyboard
- tapOn:
    id: "Continue Button"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "Password Error"
    timeout: 30000
- assertVisible:
    id: "Continue Button"
- takeScreenshot: login_wrong_credentials
