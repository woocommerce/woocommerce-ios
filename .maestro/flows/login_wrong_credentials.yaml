# p2: login.wrong-credentials
# Uses the real WP.com identity with a deliberately invalid password.
appId: ${APP_ID}
name: "Login - Wrong credentials error"
tags:
  - smoke_extended
  - flaky_quarantine
  - login
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    file: ../subflows/open_site_address_login.yaml
- tapOn:
    id: "Site address"
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: ${MAESTRO_WOO_LAB_JETPACK_STORE_URL}
- hideKeyboard
- tapOn:
    id: "Site Address Next Button"
- extendedWaitUntil:
    visible:
      id: "Email address"
    timeout: 15000
- tapOn:
    id: "Email address"
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: ${MAESTRO_WOO_LAB_WPCOM_EMAIL}
- hideKeyboard
- tapOn:
    id: "Get Started Email Continue Button"
- extendedWaitUntil:
    visible:
      id: "Password"
    timeout: 30000
- tapOn:
    id: "Password"
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: "maestro-intentionally-wrong-password"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "Continue Button|Password Error"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "Continue Button"
    commands:
      - tapOn:
          id: "Continue Button"
- runFlow:
    file: ../subflows/dismiss_save_password_prompt.yaml
- extendedWaitUntil:
    visible:
      id: "Password Error"
    timeout: 30000
- assertVisible:
    id: "Continue Button"
- takeScreenshot: login_wrong_credentials
