# p2: orders.create.products, orders.create.variable-products, orders.create.product-discount, orders.create.custom-amount, orders.create.custom-amount-note, orders.create.shipping, orders.create.customer-add, orders.create.customer-edit, orders.create.note
appId: ${APP_ID}
name: Create a run-owned order with customer, shipping, discount, amount, and note
tags:
  - smoke_extended
  - flaky_quarantine
  - destructive
  - orders
---
- stopApp
- runFlow: ../subflows/ensure_logged_in.yaml

- runFlow: ../subflows/navigate_to_orders.yaml
- tapOn:
    id: new-order-type-sheet-button
- assertVisible:
    id: new-order-create-button

# Filter to Variable products so the order always goes through the variation
# picker, then select the first variation of the first variable product.
- tapOn:
    id: new-order-add-product-button
- extendedWaitUntil:
    visible: Filter
    timeout: 15000
- tapOn: Filter
- extendedWaitUntil:
    visible: Product Type
    timeout: 15000
- tapOn: Product Type
- extendedWaitUntil:
    visible: Variable
    timeout: 15000
- tapOn: Variable
- tapOn: Show Products
- extendedWaitUntil:
    visible:
      id: product-item
    timeout: 30000
- tapOn:
    text: ".*variations.*"
    childOf:
      id: product-item
    index: 0
- extendedWaitUntil:
    visible:
      id: product-variation-item
    timeout: 30000
- tapOn:
    id: product-variation-item
    index: 0
- tapOn: Back
- tapOn:
    id: product-multiple-selection-done-button
- extendedWaitUntil:
    visible:
      text: ".*, 1 × .*"
    timeout: 30000
- takeScreenshot: order_variation_line_item

# Apply a discount on the selected variation. The discount button is exposed
# only after expanding its initially collapsed line-item card.
- tapOn:
    text: ".*, 1 × .*"
    index: 0
    point: "96%,20%"
- extendedWaitUntil:
    visible: Order Count
    timeout: 15000
- assertVisible: Add Discount
- tapOn: Add Discount
- assertVisible: Enter amount
- tapOn: Enter amount
- inputText: "1"
- tapOn: Add
- assertVisible: Discount

# Select the first existing customer. Edit Customer Details writes only the
# draft order's copied billing and shipping snapshot; it never dispatches a
# customer-update action.
- swipe:
    direction: UP
- tapOn: Add Customer Details
- runFlow:
    when:
      visible: Add Customer Details
    commands:
      - tapOn: Add Customer Details
- extendedWaitUntil:
    visible:
      id: customer-search-screen-search-field
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: ".+@.+"
      childOf:
        id: default-search-results-table-view
    timeout: 30000
- tapOn:
    text: ".+@.+"
    childOf:
      id: default-search-results-table-view
    index: 0
- extendedWaitUntil:
    visible: Edit Customer Details
    timeout: 30000
- tapOn: Edit Customer Details
- assertVisible:
    id: order-address-form-first-name-field
- assertVisible:
    text: ".+@.+"
# The existing identifier belongs to the whole row, so focus the editable
# value area explicitly without changing the app's accessibility contract.
- tapOn:
    point: "72%,24%"
- eraseText
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: Maestro-${SUITE_RUN_ID}
- tapOn:
    id: order-customer-details-done-button
- assertVisible:
    text: '[\s\S]*Maestro-${SUITE_RUN_ID}[\s\S]*'
- runFlow:
    when:
      visible: Hide details
    commands:
      - tapOn: Hide details
- scrollUntilVisible:
    element:
      id: add-shipping-button
    direction: DOWN
    timeout: 30000
- tapOn:
    id: add-shipping-button
- inputText: "1"
- tapOn:
    id: add-shipping-name-field
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: Maestro ${SUITE_RUN_ID}
- hideKeyboard
- tapOn:
    id: add-shipping-done-button
- scrollUntilVisible:
    element:
      id: new-order-add-custom-amount-button
    direction: DOWN
    timeout: 30000
- tapOn:
    id: new-order-add-custom-amount-button
- tapOn:
    id: custom-amount-fixed-button
- inputText: "1"
- tapOn:
    id: order-add-custom-amount-name-field
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: Custom amount ${SUITE_RUN_ID}
- hideKeyboard
- tapOn:
    id: order-add-custom-amount-view-add-custom-amount-button
- assertVisible: Custom amount ${SUITE_RUN_ID}
- scrollUntilVisible:
    element:
      id: add-customer-note-button
    direction: DOWN
    timeout: 30000
- tapOn:
    id: add-customer-note-button
- tapOn:
    id: edit-note-text-editor
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: Maestro order ${SUITE_RUN_ID}
- tapOn:
    id: edit-note-done-button
- tapOn:
    id: new-order-create-button

# Persisted order details, not the creation form, are the completion signal.
- extendedWaitUntil:
    visible:
      id: order-details-table-view
    timeout: 30000
- assertVisible:
    id: summary-table-view-cell-title-label
- scrollUntilVisible:
    element:
      text: Maestro order ${SUITE_RUN_ID}
    direction: DOWN
- assertVisible: Maestro order ${SUITE_RUN_ID}
- assertVisible: Custom amount ${SUITE_RUN_ID}
- scrollUntilVisible:
    element:
      text: "View Billing Information"
      below:
        text: "CUSTOMER"
    direction: DOWN
- tapOn:
    text: "View Billing Information"
    below:
      text: "CUSTOMER"
- extendedWaitUntil:
    visible: "Billing Information"
    timeout: 15000
- assertVisible:
    text: '[\s\S]*Maestro-${SUITE_RUN_ID}[\s\S]*'
- assertVisible:
    text: "Email: .+@.+"
