# p2: orders.list, orders.pagination, orders.search
# Prerequisite: the live store has enough orders to expose additional rows.
appId: ${APP_ID}
name: "Orders - List, pagination, and search"
tags:
  - smoke_core
  - orders
---
- runFlow:
    file: ../subflows/ensure_logged_in.yaml
- runFlow:
    file: ../subflows/navigate_to_orders.yaml
- assertVisible:
    id: "orders-table-view"

# The table view is present before its rows carry text, so reading row content
# immediately races the first fetch and yields an empty string on a cold cache.
# Wait for a real order number to render before capturing anything.
- extendedWaitUntil:
    visible:
      text: "#.*"
      childOf:
        id: "orders-table-view"
    timeout: 30000

# Capture a live order title (for example, "#560 Pamela Nguyen").
# Match the order-number shape rather than ".+": the table also exposes section
# headers ("YESTERDAY"), row dates ("Sep 7"), status chips ("Completed") and
# amounts ("$135.26"), and which of those lands at index 0 is not stable between
# runs.
# Seeded orders carry the run id in fields the search also matches, so skip an
# order whose number appears in the run id's digits.
- evalScript: ${output.orderRow = 0}
- evalScript: ${output.orderSearchText = ''}
- repeat:
    while:
      true: ${output.orderSearchText == '' || String(SUITE_RUN_ID).replace(/[^0-9]/g, '').indexOf(output.orderSearchText) != -1}
    times: 4
    commands:
      - copyTextFrom:
          text: "#.*"
          childOf:
            id: "orders-table-view"
          index: ${output.orderRow}
      - evalScript: ${output.initialOrderTitle = String(maestro.copiedText || '').trim()}
      - evalScript: ${output.orderSearchText = output.initialOrderTitle.split(' ')[0].replace('#', '')}
      - evalScript: ${output.orderRow = output.orderRow + 1}
- assertTrue:
    condition: ${output.initialOrderTitle.startsWith('#') && String(SUITE_RUN_ID).replace(/[^0-9]/g, '').indexOf(output.orderSearchText) == -1}
    label: Picked an order number that the run id cannot match
- takeScreenshot: orders_list

# Moving to another live row proves the list is scrollable and populated past
# its initial viewport. Stores without enough orders fail as a prerequisite.
- scroll
- scroll
- copyTextFrom:
    text: "#.*"
    childOf:
      id: "orders-table-view"
    index: 0
- evalScript: ${output.afterScrollOrderTitle = String(maestro.copiedText || '').trim()}
- assertTrue:
    condition: ${output.afterScrollOrderTitle.length > 0 && output.afterScrollOrderTitle !== output.initialOrderTitle}
    label: Orders list exposes an additional row after scrolling
# Keep this second, different order number. The search below asserts it is gone
# from the results, which is what distinguishes a real search from a list that
# ignored the query.
- evalScript: ${output.excludedOrderNumber = output.afterScrollOrderTitle.split(' ')[0].replace('#', '')}
- takeScreenshot: orders_list_scrolled

- tapOn:
    id: "order-search-button"
- extendedWaitUntil:
    visible:
      id: "order-search-screen-search-field"
    timeout: 15000
- tapOn:
    id: "order-search-screen-search-field"
- evalScript: ${output.clipboardText = output.orderSearchText}
- runFlow:
    file: ../subflows/paste_into_focused_field.yaml
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "updated-search-results-table-view"
    timeout: 30000
- assertVisible:
    text: "#${output.orderSearchText}.*"
    childOf:
      id: "updated-search-results-table-view"
# Presence alone is weak: the searched order was already on screen before the
# search ran, so a list that ignored the query entirely would also satisfy it.
# Assert a known non-matching order has gone.
- assertNotVisible:
    text: "#${output.excludedOrderNumber}.*"
    childOf:
      id: "updated-search-results-table-view"
- takeScreenshot: orders_search_results
- tapOn:
    id: "order-search-screen-cancel-button"
- assertVisible:
    id: "orders-table-view"
