# p2: products.detail.variations, products.detail.variation-attributes
# Prerequisite: store has an editable Variable product with at least one generated variation and attribute.
appId: ${APP_ID}
name: "Products - Variations and tags"
tags:
  - smoke_extended
  - flaky_quarantine
  - products
---
- runFlow:
    file: ../subflows/ensure_logged_in.yaml
- runFlow:
    file: ../subflows/navigate_to_products.yaml
- tapOn:
    id: "product-filter-button"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Product Type"
    timeout: 10000
- tapOn: "Product Type"
- extendedWaitUntil:
    visible: "Variable"
    timeout: 10000
- tapOn: "Variable"
- tapOn: "Show Products"
- extendedWaitUntil:
    visible:
      id: "products-table-view"
    timeout: 20000
- tapOn:
    point: "50%,37%"
- extendedWaitUntil:
    visible:
      id: "edit-product-more-options-button"
    timeout: 20000
- tapOn:
    id: "edit-product-more-options-button"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Product Settings"
    timeout: 10000
- tapOn: "Product Settings"
- extendedWaitUntil:
    visible: "PUBLISH SETTINGS"
    timeout: 10000
- assertVisible: "Status"
- assertVisible: "Visibility"
- tapOn: "Done"
- extendedWaitUntil:
    visible:
      id: "edit-product-more-options-button"
    timeout: 10000
- scrollUntilVisible:
    element: "Add more details"
    direction: DOWN
    timeout: 15000
- tapOn: "Add more details"
- extendedWaitUntil:
    visible: "Tags"
    timeout: 10000
- tapOn: "Tags"
- extendedWaitUntil:
    visible:
      id: "add-tags"
    timeout: 15000
- assertVisible: "Tags"
- assertVisible:
    id: "add-tags"
- takeScreenshot: products_tags
- tapOn:
    point: "10%,12%"
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- extendedWaitUntil:
    visible:
      id: "edit-product-more-options-button"
    timeout: 10000
- scrollUntilVisible:
    element: "Variations"
    direction: DOWN
    timeout: 15000
# Assert the product exposes a variation count without hardcoding a specific number,
# matching the flow's own prerequisite ("at least one generated variation"). A literal
# "2 variations" is coupled to one fixture and fails on any other store.
- assertVisible: "\\d+ variations"
- assertVisible: "Variations"
- tapOn: "Variations"
- extendedWaitUntil:
    visible: "Variations"
    timeout: 20000
- assertVisible: "Variations"
# Open the first generated variation by its "#<id> <attributes>" row rather than a
# fixed screen point. The point tap on the row's chevron was flaky while the list was
# still loading; waiting for a row and matching its label is deterministic.
- extendedWaitUntil:
    visible: "#\\d+.*"
    timeout: 20000
- tapOn:
    text: "#\\d+.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Attributes"
    timeout: 20000
- assertVisible: "Attributes"
- assertVisible: "Enabled"
- takeScreenshot: products_variation_detail
- back
- extendedWaitUntil:
    visible: "Variations"
    timeout: 10000
