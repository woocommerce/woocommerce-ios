# p2: push-no-jetpack.login, push-no-jetpack.card-visible, push-no-jetpack.unlock
# p2: push-no-jetpack.setup-completes, push-no-jetpack.card-hidden
# Logs in to a WooCommerce site without Jetpack with its site credentials and sets
# up push notifications from the My Store card. The runner disconnects the site
# from WordPress.com first, so the setup connects it again on every run.
# On the simulator the app completes the push step without a device token, so the
# real registration stays manual with the notification items.
appId: ${APP_ID}
name: "Push notifications without Jetpack"
tags:
  - smoke_extended
  - login
  - no_jetpack_store
---
- assertTrue:
    condition: ${NO_JETPACK_DISCONNECTED == "yes"}
    label: "The runner disconnected the site from WordPress.com"
- runFlow:
    file: ../subflows/login_no_jetpack_site.yaml

- extendedWaitUntil:
    visible: "Never miss a new order"
    timeout: 30000
    label: "The push notifications card shows in the first session"
- takeScreenshot: push_no_jetpack_card
- tapOn: "Never miss a new order"

- extendedWaitUntil:
    visible: "Unlock push notifications with WordPress.com"
    timeout: 15000
- tapOn: "Continue"

- extendedWaitUntil:
    visible:
      text: "Complete"
      below: "Enable push notifications"
    timeout: 60000
    label: "The push notifications setup completes"
- assertVisible: "Check plugin compatibility"
- assertVisible: "Connect store to WordPress.com"
- assertVisible:
    text: "Complete"
    index: 2
- takeScreenshot: push_no_jetpack_setup_complete
- tapOn: "Go to My Store"

- extendedWaitUntil:
    visible:
      id: "tab-bar-orders-item"
    timeout: 15000
- assertNotVisible:
    text: "Never miss a new order"
    label: "The push notifications card is hidden after the setup"
