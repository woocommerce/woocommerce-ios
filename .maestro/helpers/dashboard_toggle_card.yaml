appId: ${APP_ID}
---
- repeat:
    times: 6
    commands:
      - swipe: { start: "50%,25%", end: "50%,80%", duration: 300 }
- scrollUntilVisible:
    element: "${CARD_TITLE}"
    direction: DOWN
    timeout: 15000
    optional: true
# Record the current state first and toggle afterwards. Toggling inside the
# visibility checks would let the second check see the card the first one just
# changed and flip it back.
- evalScript: ${output['dashboardCardState_' + String(CARD_KEY)] = ''}
- runFlow:
    when:
      visible:
        id: "selectable-item-selected-${CARD_TITLE}"
    commands:
      - evalScript: ${output['dashboardCardState_' + String(CARD_KEY)] = 'selected'}
- runFlow:
    when:
      visible:
        id: "selectable-item-unselected-${CARD_TITLE}"
    commands:
      - evalScript: ${output['dashboardCardState_' + String(CARD_KEY)] = 'unselected'}
# A card that can't be shown sits in the inactive section, which has no
# selection row. Matching the "Unavailable" badge by position would also pick
# up another card's badge.
- runFlow:
    when:
      true: ${output['dashboardCardState_' + String(CARD_KEY)] === ''}
      visible: "${CARD_TITLE}"
    commands:
      - evalScript: ${output['dashboardCardState_' + String(CARD_KEY)] = 'unavailable'}
      - evalScript: ${console.log('DASHBOARD_CARD_UNAVAILABLE ' + String(CARD_TITLE))}
- runFlow:
    when:
      notVisible: "${CARD_TITLE}"
    commands:
      - evalScript: ${output['dashboardCardState_' + String(CARD_KEY)] = 'hidden'}
      - evalScript: ${console.log('DASHBOARD_CARD_HIDDEN ' + String(CARD_TITLE))}
- runFlow:
    when:
      true: ${output['dashboardCardState_' + String(CARD_KEY)] === 'selected'}
    commands:
      - runFlow:
          file: set_dashboard_card_selection.yaml
          env:
            CARD_TITLE: ${CARD_TITLE}
            DESIRED_STATE: unselected
- runFlow:
    when:
      true: ${output['dashboardCardState_' + String(CARD_KEY)] === 'unselected'}
    commands:
      - runFlow:
          file: set_dashboard_card_selection.yaml
          env:
            CARD_TITLE: ${CARD_TITLE}
            DESIRED_STATE: selected
