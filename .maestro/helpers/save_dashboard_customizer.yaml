        enabled: true
    commands:
      - tapOn:
          id: "dashboard-customization-save-button"
          enabled: true
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "dashboard-customization-save-button"
        enabled: true
    commands:
      - tapOn:
          id: "dashboard-customization-save-button"
          enabled: true
- extendedWaitUntil:
