# WooCommerce iOS Maestro smoke coverage snapshot.
#
# Source P2: https://woomobilep2.wordpress.com/flows-for-app-features-smoke-testing/
# Fetched through context-a8c wpcom/posts-text on 2026-08-05.
# P2 modified timestamp observed: 2026-07-28T06:29:33+00:00.
#
# Every item needs either `flow:` or `manual:`. Flow-backed items default to
# `fidelity: full`; partial implementations declare `fidelity: partial` and a
# concrete `gap:`. Flow YAMLs declare implemented items with `# p2:` headers,
# and .maestro/scripts/check-smoke-coverage.py validates this file offline.

items:
