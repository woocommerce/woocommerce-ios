# Authenticate to the requested Jetpack-connected store through its site URL.
# Required: MAESTRO_WOO_LAB_JETPACK_STORE_URL,
# MAESTRO_WOO_LAB_WPCOM_EMAIL, MAESTRO_WOO_LAB_WPCOM_PASSWORD.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      id: "Login Onboarding Skip Button|prologue-title-label"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "Login Onboarding Skip Button"
    commands:
      - tapOn:
          id: "Login Onboarding Skip Button"

- extendedWaitUntil:
    visible:
      id: "prologue-title-label"
    timeout: 15000
- tapOn:
    id: "Prologue Self Hosted Button"
- runFlow:
    when:
      visible: "No computer? Log in with site address"
    commands:
      - tapOn: "No computer? Log in with site address"

- extendedWaitUntil:
    visible:
      id: "Site address"
    timeout: 15000
- tapOn:
    id: "Site address"
- runFlow:
    file: paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: ${MAESTRO_WOO_LAB_JETPACK_STORE_URL}
- hideKeyboard
- tapOn:
    id: "Site Address Next Button"

- extendedWaitUntil:
    visible:
      id: "Email address"
    timeout: 30000
- tapOn:
    id: "Email address"
- runFlow:
    file: paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: ${MAESTRO_WOO_LAB_WPCOM_EMAIL}
- hideKeyboard
- tapOn:
    id: "Get Started Email Continue Button"

- extendedWaitUntil:
    visible:
      id: "Password"
    timeout: 30000
- tapOn:
    id: "Password"
- runFlow:
    file: paste_into_focused_field.yaml
    env:
      TEXT_TO_PASTE: ${MAESTRO_WOO_LAB_WPCOM_PASSWORD}
- hideKeyboard
- extendedWaitUntil:
    visible: "Continue|Manage Privacy|Save Password.*|My store"
    timeout: 15000
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Continue|Manage Privacy|My store"
    timeout: 15000
- runFlow:
    when:
      visible: "Manage Privacy"
    commands:
      - tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "Continue Button|tab-bar-my-store-item"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "Continue Button"
    commands:
      - tapOn:
          id: "Continue Button"

# The site-address route normally shows an epilogue. Validate that it selected
# the caller's store before continuing; some returning accounts skip it.
- runFlow:
    when:
      visible:
        id: "login-epilogue-continue-button"
    commands:
      - copyTextFrom:
          id: "url-label"
      - evalScript: |
          function normalized(value) {
            return String(value || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/$/, '');
          }
          if (normalized(maestro.copiedText) !== normalized(MAESTRO_WOO_LAB_JETPACK_STORE_URL)) {
            throw new Error('Login epilogue selected a different store');
          }
      - tapOn:
          id: "login-epilogue-continue-button"

- runFlow:
    when:
      visible: "Got it"
    commands:
      - tapOn: "Got it"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"

- extendedWaitUntil:
    visible:
      id: "tab-bar-my-store-item"
    timeout: 60000
