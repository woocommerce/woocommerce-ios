# RuboCop overrides for the AI translation engine.
#
# Production code under lib/ and bin/ is kept to the project-wide standard.
# Exceptions below cover:
#   - The IosResources parser, which is a state machine across mutually
#     recursive scanner methods; splitting it artificially would harm
#     readability.
#   - Test files (spec/), which accumulate test methods.
#   - One-off bootstrap scripts (scripts/), historical artifacts kept for
#     audit, not maintained going forward.
#   - The Rakefile, where one `namespace :translate` block legitimately
#     wraps every task.

inherit_from: ../../.rubocop.yml

AllCops:
  SuggestExtensions: false

Metrics/AbcSize:
  Exclude:
    - 'spec/**/*'
    - 'scripts/**/*'
    # bin/translate_locale.rb has main() and translate_file() orchestrators
    # whose ABC is dominated by error-reporting branches.
    - 'bin/**/*'
    # Parser / API client / translator have necessarily branchy methods.
    - 'lib/woo_ai_translation/ios_resources.rb'
    - 'lib/woo_ai_translation/anthropic_client.rb'
    - 'lib/woo_ai_translation/translator.rb'
    # OpenAI client mirrors AnthropicClient's shape; same branchy http path.
    - 'lib/woo_ai_translation/openai_client.rb'
    # ShadowDiff's categorize/sample/render methods have many small branches
    # that the rule reads as high-ABC; splitting them artificially hurts
    # readability of the comparison logic.
    - 'lib/woo_ai_translation/shadow_diff.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'spec/**/*'
    - 'scripts/**/*'
    - 'bin/**/*'
    - 'lib/woo_ai_translation/ios_resources.rb'
    - 'lib/woo_ai_translation/translator.rb'
    - 'lib/woo_ai_translation/shadow_diff.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'spec/**/*'
    - 'scripts/**/*'
    - 'bin/**/*'
    - 'lib/woo_ai_translation/ios_resources.rb'

Metrics/MethodLength:
  Exclude:
    - 'spec/**/*'
    - 'scripts/**/*'
    - 'bin/**/*'
    - 'lib/woo_ai_translation/ios_resources.rb'

Metrics/ClassLength:
  Exclude:
    - 'spec/**/*'

Metrics/ModuleLength:
  Exclude:
    - 'lib/woo_ai_translation/ios_resources.rb'
    # ShadowDiff bundles categorizer + worksheet writer + report writer in
    # one module by design (all operate on the same Entry/LocaleResult
    # shapes); splitting would scatter related code.
    - 'lib/woo_ai_translation/shadow_diff.rb'

Metrics/BlockLength:
  Exclude:
    - 'Rakefile'
    - 'bin/**/*'

Metrics/BlockNesting:
  Exclude:
    - 'scripts/**/*'

Metrics/ParameterLists:
  # `translate_file` in bin/translate_locale.rb takes 8+ kwargs (input,
  # output, translator, locale, model, limit, logger, incremental, validator).
  # All are explicitly named so it stays readable.
  Exclude:
    - 'bin/**/*'

Style/Documentation:
  Exclude:
    - 'spec/**/*'

Style/OneClassPerFile:
  # Test files often bundle small helper stub classes (e.g.
  # `FakeHttp`, `ProgrammableJudgeStub`, `ModelAwareStubClient`) alongside
  # the `*Test` class itself; splitting harms locality. Also some spec files
  # use multiple `*Test` classes per concern (e.g. shadow_diff_test.rb).
  Exclude:
    - 'spec/**/*'

Style/FormatStringToken:
  Exclude:
    - 'scripts/**/*'
    - 'bin/**/*'

Style/MultilineBlockChain:
  Exclude:
    - 'bin/**/*'

Naming/MethodParameterName:
  AllowedNames:
    - 'tx'  # translation
    - 'p'   # OptionParser block param
    - 'en'  # English source — paired with gp/ai in shadow-diff comparisons
    - 'gp'  # GlotPress human translation — paired with en/ai
    - 'ai'  # AI proposal — paired with en/gp

Lint/UselessConstantScoping:
  # Struct/lookup table constants are intentionally namespaced under their
  # parent class; the "private" wrap doesn't apply to constants but the
  # encapsulation intent is clear from the surrounding code.
  Exclude:
    - 'lib/woo_ai_translation/validator.rb'
    - 'lib/woo_ai_translation/ios_resources.rb'
